<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Loan Default Risk Predictor</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
```

</head>

<body class="bg-light">

<div class="container py-5">

```
<div class="card shadow-lg border-0">

    <div class="card-body p-5">

        <h1 class="text-center mb-3">
            💰 Loan Default Risk Predictor
        </h1>

        <p class="text-center text-muted mb-4">
            Estimate the risk of loan default using machine learning.
        </p>

        <form id="predictForm">

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label>Age</label>
                    <input type="number"
                           class="form-control"
                           id="person_age"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Annual Income</label>
                    <input type="number"
                           class="form-control"
                           id="person_income"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Employment Length</label>
                    <input type="number"
                           class="form-control"
                           id="person_emp_length"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Loan Amount</label>
                    <input type="number"
                           class="form-control"
                           id="loan_amnt"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Interest Rate (%)</label>
                    <input type="number"
                           class="form-control"
                           id="loan_int_rate"
                           required>
                </div>

                <div class="col-md-4 mb-3">
                    <label>Credit History Length</label>
                    <input type="number"
                           class="form-control"
                           id="cb_person_cred_hist_length"
                           required>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Home Ownership</label>
                    <select class="form-select"
                            id="person_home_ownership">

                        <option value="0">Mortgage</option>
                        <option value="1">Own</option>
                        <option value="2">Rent</option>
                        <option value="3">Other</option>

                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Loan Grade</label>
                    <select class="form-select"
                            id="loan_grade">

                        <option value="0">A</option>
                        <option value="1">B</option>
                        <option value="2">C</option>
                        <option value="3">D</option>
                        <option value="4">E</option>
                        <option value="5">F</option>
                        <option value="6">G</option>

                    </select>
                </div>

            </div>

            <button type="submit"
                    class="btn btn-primary w-100">

                Predict Risk

            </button>

        </form>

        <div class="mt-4">

            <div id="resultCard"
                 class="alert d-none">

            </div>

        </div>

    </div>

</div>
```

</div>

<script>

document.getElementById("predictForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const age =
    parseFloat(document.getElementById("person_age").value);

    const income =
    parseFloat(document.getElementById("person_income").value);

    const emp =
    parseFloat(document.getElementById("person_emp_length").value);

    const loan =
    parseFloat(document.getElementById("loan_amnt").value);

    const rate =
    parseFloat(document.getElementById("loan_int_rate").value);

    const cred =
    parseFloat(document.getElementById("cb_person_cred_hist_length").value);

    const home =
    parseInt(document.getElementById("person_home_ownership").value);

    const grade =
    parseInt(document.getElementById("loan_grade").value);

    const data = {

        person_age: age,
        person_income: income,
        person_home_ownership: home,
        person_emp_length: emp,
        loan_grade: grade,
        loan_amnt: loan,
        loan_int_rate: rate,

        loan_percent_income: loan / income,

        cb_person_default_on_file: 0,
        cb_person_cred_hist_length: cred,

        loan_intent_EDUCATION: 0,
        loan_intent_HOMEIMPROVEMENT: 0,
        loan_intent_MEDICAL: 0,
        loan_intent_PERSONAL: 1,
        loan_intent_VENTURE: 0,

        loan_to_income_ratio: loan / income,
        financial_burden: loan * rate,
        income_per_year_emp: income / emp,
        cred_hist_to_age_ratio: cred / age,
        int_to_loan_ratio: rate / loan,
        loan_int_emp_interaction: loan * emp,
        debt_to_credit_ratio: loan / cred,
        int_to_cred_hist: rate / cred,
        int_per_year_emp: rate / emp,
        loan_amt_per_emp_year: loan / emp,
        income_to_loan_ratio: income / loan
    };

    const response =
    await fetch("/predict", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify(data)

    });

    const result =
    await response.json();

    const card =
    document.getElementById("resultCard");

    card.classList.remove("d-none");

    const risk =
    (result.default_probability * 100)
    .toFixed(2);

    if(result.default_probability < 0.20){

        card.className =
        "alert alert-success";

        card.innerHTML =
        `
        <h4>✅ Low Default Risk</h4>
        <p>Default Probability: ${risk}%</p>
        `;

    }
    else if(result.default_probability < 0.50){

        card.className =
        "alert alert-warning";

        card.innerHTML =
        `
        <h4>⚠ Moderate Risk</h4>
        <p>Default Probability: ${risk}%</p>
        `;

    }
    else{

        card.className =
        "alert alert-danger";

        card.innerHTML =
        `
        <h4>❌ High Default Risk</h4>
        <p>Default Probability: ${risk}%</p>
        `;

    }

});

</script>

</body>
</html>
